[package]
name = "pdf-analyzer"
version = "0.1.0"
edition = "2024"

[lib]
name = "pdf_analyzer"
path = "src/lib.rs"

[[bin]]
name = "pdf-analyzer"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
lopdf = "0.47.0"
pdf-extract = "0.12.1"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"


