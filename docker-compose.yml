# Despliegue de Referidos en EC2 (sa-east-1)
# Imágenes desde ECR; Caddy resuelve TLS (Let's Encrypt) en el borde.
# Variables esperadas en el entorno: ECR_REGISTRY (ej: 407024121863.dkr.ecr.sa-east-1.amazonaws.com)
# y TAG (opcional, por defecto "latest"). Los secretos van en ./.env (no versionado).
services:
  backend:
    image: ${ECR_REGISTRY}/referidos-backend:${TAG:-latest}
    env_file: backend.env
    # CA de RDS para validar TLS en NODE_ENV=production (DB_SSL_CA apunta aquí)
    volumes:
      - ./rds-ca.pem:/app/certs/rds-ca.pem:ro
    expose:
      - "8080"
    networks:
      - default
      - pdf
    restart: unless-stopped

  # Analizador de PDF (Rust). Sin autenticación: no publica puertos y vive en una
  # red interna sin salida a internet que solo comparte con el backend
  # (backend.env: PDF_ANALYZER_URL=http://pdf-analyzer:4002).
  pdf-analyzer:
    image: ${ECR_REGISTRY}/referidos-pdf-analyzer:${TAG:-latest}
    environment:
      # La EC2 tiene 1,9 GB: un análisis a la vez y techo de memoria, para que un
      # PDF pesado tumbe este contenedor y no al backend.
      MAX_CONCURRENCY: "1"
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pdf
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/referidos-frontend:${TAG:-latest}
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  pdf:
    internal: true

volumes:
  caddy_data:
  caddy_config:
